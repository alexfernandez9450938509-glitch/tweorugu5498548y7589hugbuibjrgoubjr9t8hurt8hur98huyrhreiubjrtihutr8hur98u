name: Build iOS IPA

on:
  workflow_dispatch: # Allows you to trigger the build manually with a button

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          brew install autoconf automake libtool pkg-config

      - name: Install kivy-ios and Cython
        run: |
          pip install "cython<3.0.0" kivy-ios

      - name: Build C-Recipes (Compile Python & Kivy for iOS)
        run: |
          toolchain build python3 kivy requests

      - name: Create Xcode Project
        run: |
          toolchain create DNSLogApp .

      - name: Build Unsigned IPA Container
        run: |
          cd dnslogapp-ios
          xcodebuild -project dnslogapp.xcodeproj -scheme dnslogapp -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath build

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -r dnslogapp-ios/build/Build/Products/Release-iphoneos/dnslogapp.app Payload/
          zip -r DNSLogApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNSLogApp-iOS-IPA
          path: DNSLogApp.ipa
